<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>SwiftCom — UI/UX Design</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&display=swap" rel="stylesheet"/>
<style>
  html, body { margin: 0; padding: 0; background: #f0eee9; font-family: Outfit, system-ui, sans-serif; }
  * { box-sizing: border-box; }
  @keyframes shimmer {
    0% { background-position: -200% 0; }
    100% { background-position: 200% 0; }
  }
  @keyframes pulse {
    0%, 100% { opacity: 1; }
    50%      { opacity: 0.5; }
  }
</style>
</head>
<body>
<div id="root"></div>

<template id="__bundler_thumbnail" data-bg-color="#5E17EB">
  <svg viewBox="0 0 1200 800" xmlns="http://www.w3.org/2000/svg">
    <defs>
      <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
        <stop offset="0" stop-color="#5E17EB"/>
        <stop offset="1" stop-color="#3A0CAA"/>
      </linearGradient>
    </defs>
    <rect width="1200" height="800" fill="url(#g)"/>
    <g transform="translate(600 400)">
      <rect x="-130" y="-130" width="260" height="260" rx="60" fill="#ffffff"/>
      <path d="M40 -90 L-50 30 L0 30 L-20 90 L60 -10 L10 -10 L40 -90 Z" fill="#5E17EB"/>
    </g>
    <text x="600" y="640" text-anchor="middle" font-family="Outfit, system-ui, sans-serif" font-weight="800" font-size="64" fill="#ffffff" letter-spacing="-1">SwiftCom</text>
    <text x="600" y="690" text-anchor="middle" font-family="Outfit, system-ui, sans-serif" font-size="22" fill="#ffffff" opacity="0.65">Connecting people...</text>
  </svg>
</template>

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

<script type="text/babel" src="design-canvas.jsx"></script>
<script type="text/babel" src="tokens.jsx"></script>
<script type="text/babel" src="screens-1-onboarding.jsx"></script>
<script type="text/babel" src="screens-2-auth.jsx"></script>
<script type="text/babel" src="screens-3-kyc.jsx"></script>
<script type="text/babel" src="screens-4-dashboard.jsx"></script>
<script type="text/babel" src="screens-5-messaging.jsx"></script>
<script type="text/babel" src="screens-6-wallet.jsx"></script>
<script type="text/babel" src="screens-7-esim.jsx"></script>
<script type="text/babel" src="screens-8-aibot-profile.jsx"></script>
<script type="text/babel" src="components-library.jsx"></script>

<script type="text/babel" data-presets="react">
const W = 390, H = 844;

function App() {
  return (
    <DesignCanvas>
      <DCSection id="cover" title="SwiftCom · UI/UX System" subtitle="20 screens + component library · iPhone 14 Pro · 390×844 · Outfit">
        <DCArtboard id="cover" label="Brand cover" width={880} height={420}>
          <CoverCard/>
        </DCArtboard>
      </DCSection>

      <DCSection id="f1" title="Frame 1 · Splash + Onboarding" subtitle="First-run experience">
        <DCArtboard id="splash" label="01 · Splash"        width={W} height={H}><ScreenSplash/></DCArtboard>
        <DCArtboard id="onb1"   label="02 · Onboard · Chat" width={W} height={H}><ScreenOnboard1/></DCArtboard>
        <DCArtboard id="onb2"   label="03 · Onboard · Money" width={W} height={H}><ScreenOnboard2/></DCArtboard>
        <DCArtboard id="onb3"   label="04 · Onboard · eSIM" width={W} height={H}><ScreenOnboard3/></DCArtboard>
      </DCSection>

      <DCSection id="f2" title="Frame 2 · Authentication" subtitle="Sign up · Verify · Sign in">
        <DCArtboard id="signup" label="05 · Sign Up"        width={W} height={H}><ScreenSignUp/></DCArtboard>
        <DCArtboard id="otp"    label="06 · Email OTP"      width={W} height={H}><ScreenOTP/></DCArtboard>
        <DCArtboard id="signin" label="07 · Sign In"        width={W} height={H}><ScreenSignIn/></DCArtboard>
      </DCSection>

      <DCSection id="f3" title="Frame 3 · KYC Verification" subtitle="Nigerian NIN / BVN flow">
        <DCArtboard id="kycMethod"  label="08 · KYC · Method"  width={W} height={H}><ScreenKYCMethod/></DCArtboard>
        <DCArtboard id="kycInput"   label="09 · KYC · NIN Input" width={W} height={H}><ScreenKYCInput/></DCArtboard>
        <DCArtboard id="kycSuccess" label="10 · KYC · Success" width={W} height={H}><ScreenKYCSuccess/></DCArtboard>
      </DCSection>

      <DCSection id="f4" title="Frame 4 · Dashboard + Feed" subtitle="Home + social feed">
        <DCArtboard id="dash"  label="11 · Dashboard" width={W} height={H}><ScreenDashboard/></DCArtboard>
        <DCArtboard id="feed"  label="12 · Feed"      width={W} height={H}><ScreenFeed/></DCArtboard>
      </DCSection>

      <DCSection id="f5" title="Frame 5 · Messaging + Calls" subtitle="WhatsApp-familiar UX patterns">
        <DCArtboard id="msgs" label="13 · Messages list" width={W} height={H}><ScreenMessages/></DCArtboard>
        <DCArtboard id="chat" label="14 · 1-on-1 Chat"    width={W} height={H}><ScreenChat/></DCArtboard>
        <DCArtboard id="call" label="15 · Voice Call"     width={W} height={H}><ScreenVoiceCall/></DCArtboard>
      </DCSection>

      <DCSection id="f6" title="Frame 6 · Wallet + Bills" subtitle="Naira-only · ₦ formatting throughout">
        <DCArtboard id="wallet" label="16 · Wallet"    width={W} height={H}><ScreenWallet/></DCArtboard>
        <DCArtboard id="bills"  label="17 · Pay Bills" width={W} height={H}><ScreenBills/></DCArtboard>
      </DCSection>

      <DCSection id="f7" title="Frame 7 · eSIM + Alerts" subtitle="Manage data plans · system alerts">
        <DCArtboard id="esim"   label="18 · My eSIM"     width={W} height={H}><ScreenESIM/></DCArtboard>
        <DCArtboard id="alerts" label="(extra) · Alerts" width={W} height={H}><ScreenNotifications/></DCArtboard>
      </DCSection>

      <DCSection id="f8" title="Frame 8 · AI Bot + Profile" subtitle="SwiftBot AI · account settings">
        <DCArtboard id="bot"     label="19 · SwiftBot AI"  width={W} height={H}><ScreenAIBot/></DCArtboard>
        <DCArtboard id="profile" label="20 · Profile"      width={W} height={H}><ScreenProfile/></DCArtboard>
      </DCSection>

      <DCSection id="f9" title="Frame 9 · Component Library" subtitle="Atoms · primitives · used across all screens">
        <DCArtboard id="lib" label="Component sheet" width={880} height={1900}>
          <ComponentLibrary/>
        </DCArtboard>
      </DCSection>
    </DesignCanvas>
  );
}

// Cover card — wide artboard with brand summary
function CoverCard() {
  return (
    <div style={{
      width: 880, height: 420, padding: 40,
      background: SC.purpleGradDiag, color: '#fff',
      position: 'relative', overflow: 'hidden',
      fontFamily: SC.font,
    }}>
      {/* watermark bolts */}
      <svg style={{ position: 'absolute', top: -40, right: -40, opacity: 0.12 }} width="340" height="340" viewBox="0 0 24 24"><path d="M13.5 2L4 14h6l-1.5 8L19 10h-6l.5-8z" fill="#fff"/></svg>
      <div style={{ position: 'absolute', bottom: -80, left: -40, width: 200, height: 200, borderRadius: '50%', background: 'rgba(255,255,255,0.05)' }}/>

      <div style={{ position: 'relative', display: 'flex', flexDirection: 'column', height: '100%' }}>
        <div style={{ display: 'flex', alignItems: 'center', gap: 16, marginBottom: 24 }}>
          <div style={{ width: 64, height: 64, borderRadius: 16, background: '#fff', display: 'flex', alignItems: 'center', justifyContent: 'center', color: SC.primary, boxShadow: '0 12px 30px rgba(0,0,0,0.2)' }}>{Ico.bolt(36)}</div>
          <div>
            <div style={{ fontSize: 11, opacity: 0.7, letterSpacing: 2, fontWeight: 700 }}>FINTECH · SUPER-APP · NIGERIA</div>
            <div style={{ fontSize: 48, fontWeight: 800, letterSpacing: -1.2, lineHeight: 1 }}>SwiftCom</div>
            <div style={{ fontSize: 14, opacity: 0.75, marginTop: 4 }}>Connecting people...</div>
          </div>
        </div>

        <div style={{ flex: 1, display: 'grid', gridTemplateColumns: '1.4fr 1fr 1fr', gap: 18, alignItems: 'end' }}>
          <div style={{ background: 'rgba(255,255,255,0.10)', backdropFilter: 'blur(20px)', border: '1px solid rgba(255,255,255,0.18)', borderRadius: 16, padding: 18 }}>
            <div style={{ fontSize: 11, opacity: 0.7, letterSpacing: 1, fontWeight: 600 }}>SCOPE</div>
            <div style={{ fontSize: 18, fontWeight: 700, marginTop: 6 }}>20 screens · 10 flows · 1 component library</div>
            <div style={{ fontSize: 12, opacity: 0.75, marginTop: 6, lineHeight: 1.5 }}>Communication + financial services + eSIM in one app. iPhone 14 Pro (390 × 844). Outfit. ₦ throughout.</div>
          </div>
          <div style={{ background: 'rgba(255,255,255,0.10)', backdropFilter: 'blur(20px)', border: '1px solid rgba(255,255,255,0.18)', borderRadius: 16, padding: 18 }}>
            <div style={{ fontSize: 11, opacity: 0.7, letterSpacing: 1, fontWeight: 600 }}>PALETTE</div>
            <div style={{ display: 'flex', gap: 6, marginTop: 8 }}>
              {[SC.primary, SC.primaryDark, SC.success, SC.warning, SC.danger, SC.ink].map((c, i) => (
                <div key={i} style={{ width: 26, height: 26, borderRadius: 8, background: c, border: '1.5px solid rgba(255,255,255,0.3)' }}/>
              ))}
            </div>
            <div style={{ fontSize: 12, opacity: 0.75, marginTop: 8 }}>Electric purple · WCAG AA</div>
          </div>
          <div style={{ background: 'rgba(255,255,255,0.10)', backdropFilter: 'blur(20px)', border: '1px solid rgba(255,255,255,0.18)', borderRadius: 16, padding: 18 }}>
            <div style={{ fontSize: 11, opacity: 0.7, letterSpacing: 1, fontWeight: 600 }}>HOW TO USE</div>
            <div style={{ fontSize: 12, opacity: 0.85, marginTop: 8, lineHeight: 1.5 }}>Pan with two-finger drag. Pinch or ⌘+wheel to zoom. Click any screen label to open in focus mode (←/→ to navigate).</div>
          </div>
        </div>
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
